<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Gaze Light</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-mode="start">
  <!-- What the projector shows during calibration and capture: black, dots, a cross. -->
  <canvas id="out"></canvas>
  <!-- The soft light (WebGL), shown on black. -->
  <canvas id="light"></canvas>
  <!-- Segment compositions (WebGL). -->
  <canvas id="seg"></canvas>
  <!-- Live camera view (setup only). -->
  <video id="cam" playsinline muted autoplay></video>
  <!-- Markings drawn over the camera view. -->
  <canvas id="overlay"></canvas>

  <div id="start">
    <h1>Gaze Light</h1>
    <p>Put the phone on the tripod in landscape, start Smart View, then tap Start.</p>
    <button id="startBtn" class="primary big">Start</button>
    <p id="startNote" class="muted small"></p>
  </div>

  <div id="toolbar">
    <div id="tools" class="row"></div>
    <div id="status" class="chips"></div>
  </div>

  <div id="card"></div>
  <div id="review"></div>
  <div id="msg" role="status"></div>
  <div id="hotspot" aria-label="Open menu"></div>

  <aside id="panel" hidden>
    <header>
      <b>Gaze Light</b>
      <span id="ver" class="muted small"></span>
    </header>

    <section>
      <h3>Performance</h3>
      <label>What to perform
        <select id="setKind">
          <option value="segments">Segments: colour compositions</option>
          <option value="gaze">Gaze: soft light following the readings</option>
        </select>
      </label>
      <div class="row" style="margin-top:10px">
        <button data-act="perform" class="primary">Perform</button>
        <button data-act="pause" id="pauseBtn">Pause</button>
        <button data-act="next">Next</button>
        <button data-act="stopperform">Stop</button>
      </div>
      <p id="perfStatus" class="muted small"></p>

      <div id="segControls">
        <div class="row" style="margin-top:8px">
          <button data-act="savecomp">♥ Save this composition</button>
          <button data-act="clearcomps">Clear saved</button>
        </div>
        <p id="segStatus" class="muted small"></p>
        <label>Compositions
          <select id="setSource">
            <option value="mix">New and saved</option>
            <option value="saved">Only saved</option>
            <option value="new">Only new</option>
          </select>
        </label>
        <label>Hold each <span id="o-hold" class="muted"></span>
          <input type="range" data-seg="hold" min="3" max="120" step="1">
        </label>
        <label>Crossfade <span id="o-fade" class="muted"></span>
          <input type="range" data-seg="fade" min="0.5" max="30" step="0.5">
        </label>
        <label>Colour coverage <span id="o-cover" class="muted"></span>
          <input type="range" data-seg="cover" min="0.1" max="0.9" step="0.05">
        </label>
        <label>Light on the rest of the painting <span id="o-neutral" class="muted"></span>
          <input type="range" data-seg="neutral" min="0" max="1" step="0.05">
        </label>
        <label>Colour brightness <span id="o-strength" class="muted"></span>
          <input type="range" data-seg="strength" min="0.2" max="1" step="0.05">
        </label>
      </div>

      <div id="gazeControls">
      <label class="check"><input type="checkbox" id="setSpeak"> Speak the readings</label>
      <div class="row" style="margin-top:8px"><button data-act="nextreading">Next reading</button></div>
      <label>Movement
        <select id="setMovement">
          <option value="dissolve">Dissolve: fade here, bloom there</option>
          <option value="glide">Glide</option>
          <option value="mixed">Glide near, dissolve far</option>
        </select>
      </label>
      <label>Dark pause between readings <span id="o-pauseBetween" class="muted"></span>
        <input type="range" id="setPauseBetween" min="0" max="20" step="1">
      </label>
      <h3 style="margin-top:14px">Readings</h3>
      <p id="readingsInfo" class="muted small"></p>
      <div id="links"></div>
      <div class="row" style="margin-top:8px"><button data-act="reloadreadings">Reload readings</button></div>
      </div>
    </section>

    <section>
      <h3>Voice</h3>
      <label>Voice <select id="setVoice"></select></label>
      <label>Speed <span id="o-rate" class="muted"></span>
        <input type="range" id="setRate" min="0.6" max="1.3" step="0.05">
      </label>
      <label>Pitch <span id="o-pitch" class="muted"></span>
        <input type="range" id="setPitch" min="0.6" max="1.4" step="0.05">
      </label>
      <div class="row" style="margin-top:8px"><button data-act="voicetest">Test voice</button></div>
    </section>

    <section>
      <h3>Show</h3>
      <div class="row">
        <button data-act="camera">Camera view</button>
        <button data-act="testlight">Test light</button>
        <button data-act="black">Black</button>
      </div>
    </section>

    <section>
      <h3>Paintings</h3>
      <div class="row">
        <button data-act="paintings">Edit corners</button>
        <button data-act="capture">Capture images</button>
        <button data-act="showsegs">Show segments</button>
      </div>
      <div id="paintList"></div>
      <input type="file" id="photoInput" accept="image/*" hidden>
      <label>Light while capturing
        <select id="setCapLight">
          <option value="black">Room light (projector black)</option>
          <option value="white">Projector, warm white</option>
        </select>
      </label>
    </section>

    <section>
      <h3>Light</h3>
      <label>Brightness <span id="o-brightness" class="muted"></span>
        <input type="range" data-light="brightness" min="0.1" max="1" step="0.05">
      </label>
      <label>Size <span id="o-size" class="muted"></span>
        <input type="range" data-light="size" min="0.4" max="2.5" step="0.05">
      </label>
      <label>Softness <span id="o-softness" class="muted"></span>
        <input type="range" data-light="softness" min="0" max="1" step="0.05">
      </label>
      <label>Falloff distance <span id="o-falloff" class="muted"></span>
        <input type="range" data-light="falloff" min="0" max="1.5" step="0.05">
      </label>
      <label>Transition <span id="o-transition" class="muted"></span>
        <input type="range" data-light="transition" min="0.5" max="8" step="0.5">
      </label>
      <label>Colour
        <span class="row" style="margin-top:6px; align-items:center">
          <input type="color" id="setColor">
          <button data-act="warmwhite">Warm white</button>
        </span>
      </label>
    </section>

    <section>
      <h3>Calibration</h3>
      <div class="row">
        <button data-act="calibrate" class="primary">Calibrate</button>
        <button data-act="forget">Forget</button>
      </div>
      <p id="calStatus" class="muted small"></p>
      <label>Dot grid
        <select id="setGrid">
          <option value="4x3">4 × 3 (quick)</option>
          <option value="5x4">5 × 4</option>
          <option value="6x5">6 × 5</option>
          <option value="8x6">8 × 6 (slow, precise)</option>
        </select>
      </label>
      <label>Dot size <span id="dotOut" class="muted"></span>
        <input type="range" id="setDot" min="1" max="8" step="0.5">
      </label>
    </section>

    <section>
      <h3>Camera</h3>
      <label>Camera <select id="setDevice"></select></label>
      <label>Resolution
        <select id="setRes">
          <option value="720">720p</option>
          <option value="1080">1080p</option>
          <option value="2160">4K (sharper painting images)</option>
        </select>
      </label>
      <label>Preview brightness <span id="dimOut" class="muted"></span>
        <input type="range" id="setDim" min="0.15" max="1" step="0.05">
      </label>
      <p id="camInfo" class="muted small"></p>
    </section>

    <section>
      <h3>Screen and sound</h3>
      <div class="row">
        <button data-act="fullscreen">Fullscreen</button>
        <button data-act="reload">Reload</button>
      </div>
      <p id="screenInfo" class="muted small"></p>
    </section>

    <p class="muted small">Tap the top-right corner to close this menu.</p>
  </aside>

  <script type="module" src="js/app.js"></script>
</body>
</html>
